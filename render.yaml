# Blueprint Render — API Branché (offre gratuite).
services:
  - type: web
    name: branche-api
    runtime: node
    plan: free
    region: frankfurt
    rootDir: apps/api
    buildCommand: cd ../.. && npm ci --workspace apps/api --include-workspace-root=false && npm run build -w apps/api
    startCommand: npm start
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: PAYMENT_PROVIDER
        value: mock
      - key: CHARGER_ADAPTER
        value: simulator
      - key: TRUST_PROXY
        value: "1"
      - key: PRICE_CENTS_PER_KWH
        value: "45"
      - key: FEE_CENTS
        value: "49"
      - key: PREAUTH_CENTS
        value: "5000"
      - key: SIM_POWER_KW
        value: "50"
      - key: SIM_SPEED
        value: "20"
      # Anti open-redirect, à saisir sur Render : branche://,https://<votre-identifiant>.github.io/branche/app/
      - key: ALLOWED_RETURN_PREFIXES
        sync: false
      # URL publique (par défaut : RENDER_EXTERNAL_URL fourni par Render).
      - key: PUBLIC_URL
        sync: false
      # Secrets Stripe (mode test uniquement en V1) — à saisir dans le tableau de bord.
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false
      # Itinéraire avec trafic (serveur uniquement, jamais renvoyée). Clé gratuite : developer.tomtom.com.
      # Sans clé : repli Valhalla sans trafic (le serveur public FOSSGIS n'est pas prévu pour la production).
      - key: TOMTOM_API_KEY
        sync: false
      # Instance Valhalla auto-hébergée recommandée en production (défaut : serveur public FOSSGIS).
      - key: VALHALLA_URL
        sync: false
      # Flux DATEX II Bison Futé, événements RRN non concédé (Licence Ouverte 2.0).
      - key: INCIDENTS_URL
        value: https://www.data.gouv.fr/api/1/datasets/r/d16c8cb6-0123-44e7-b8b1-f99fc6a59497
